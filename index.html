<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta property="og:title" content="DevSecOps Enterprise Academy" />

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function () {
        function isExtensionError(source, message, stack) {
          var s = String(source || '');
          var m = String(message || '');
          var st = String(stack || '');
          return (
            s.indexOf('chrome-extension://') === 0 ||
            s.indexOf('moz-extension://') === 0 ||
            st.indexOf('chrome-extension://') !== -1 ||
            st.indexOf('moz-extension://') !== -1 ||
            m.indexOf('Failed to connect to MetaMask') !== -1
          );
        }
        window.addEventListener(
          'error',
          function (e) {
            var err = e.error;
            if (isExtensionError(e.filename, e.message, err && err.stack)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
        window.addEventListener(
          'unhandledrejection',
          function (e) {
            var reason = e.reason;
            var msg = reason && (reason.message || reason);
            var stack = reason && reason.stack;
            if (isExtensionError('', msg, stack)) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500/20 selection:text-cyan-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
